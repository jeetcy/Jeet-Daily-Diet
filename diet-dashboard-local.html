<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roz Ka Thaal — Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Karla:wght@400;500;700&display=swap');

  :root{
    --paper:#F6F2E7;
    --ink:#26331F;
    --green-deep:#3C5A34;
    --green-soft:#7C9A6C;
    --green-pale:#E4EBDD;
    --mustard:#D8A93A;
    --brick:#A8503A;
    --line:#D9CFB6;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Karla',sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:760px;margin:0 auto;padding:24px 16px 60px;}

  header{margin-bottom:16px;}
  .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--green-deep);font-weight:700;margin-bottom:6px;}
  h1{font-family:'Fraunces',serif;font-weight:700;font-size:32px;margin:0 0 4px;color:var(--green-deep);line-height:1.05;}
  .sub{font-size:13px;color:#5b5b4f;max-width:50ch;}

  /* Top nav */
  .nav{display:flex;gap:8px;margin:20px 0 18px;border-bottom:1.5px solid var(--line);}
  .nav-btn{
    font-family:'Fraunces',serif;font-weight:700;font-size:15px;
    background:none;border:none;padding:8px 2px 10px;
    color:#9a9a86;cursor:pointer;position:relative;
  }
  .nav-btn.active{color:var(--green-deep);}
  .nav-btn.active::after{
    content:'';position:absolute;left:0;right:0;bottom:-1.5px;height:2.5px;
    background:var(--mustard);border-radius:2px;
  }

  /* ---- TRACK VIEW ---- */
  .date-bar{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:16px;
  }
  .date-nav-btn{
    width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);
    background:#fff;color:var(--green-deep);font-size:16px;font-weight:700;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .date-label{text-align:center;}
  .date-label .d{font-family:'Fraunces',serif;font-weight:700;font-size:18px;color:var(--green-deep);}
  .date-label .today-pill{
    font-size:10px;color:var(--mustard);font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    display:block;margin-top:2px;
  }

  .progress-row{display:flex;align-items:center;gap:10px;font-size:12px;color:#5b5b4f;margin-bottom:20px;}
  .progress-track{flex:1;height:5px;background:var(--line);border-radius:3px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--mustard);transition:width .25s ease;}

  .section{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 16px 6px;margin-bottom:14px;}
  .section-head{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;}
  .section-num{font-family:'Fraunces',serif;font-weight:700;font-size:13px;color:var(--mustard);}
  .section-title{font-family:'Fraunces',serif;font-weight:700;font-size:17px;color:var(--green-deep);}
  .section-time{margin-left:auto;font-size:11px;color:#9a9a86;font-weight:700;}

  .item{display:flex;align-items:flex-start;gap:10px;padding:9px 2px;border-bottom:1px solid #F0ECDE;cursor:pointer;}
  .item:last-child{border-bottom:none;}
  .box{flex:0 0 18px;height:18px;margin-top:2px;border:1.5px solid var(--green-soft);border-radius:5px;position:relative;transition:all .15s ease;}
  .item.checked .box{background:var(--green-deep);border-color:var(--green-deep);}
  .item.checked .box::after{content:'';position:absolute;left:5px;top:1px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(40deg);}
  .item-text{font-size:14.5px;line-height:1.4;color:var(--ink);}
  .item.checked .item-text{color:#9a9a86;text-decoration:line-through;}
  .item-text .alt{color:#8a8a76;font-weight:400;font-size:13px;}

  /* ---- DASHBOARD VIEW ---- */
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px;}
  .stat-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 10px;text-align:center;}
  .stat-num{font-family:'Fraunces',serif;font-weight:700;font-size:26px;color:var(--green-deep);}
  .stat-label{font-size:10.5px;color:#8a8a76;text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
  .stat-card.streak .stat-num{color:var(--brick);}

  .panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;}
  .panel-title{font-family:'Fraunces',serif;font-weight:700;font-size:15px;color:var(--green-deep);margin-bottom:12px;}

  .bars{display:flex;align-items:flex-end;gap:5px;height:90px;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .bar{width:100%;border-radius:4px 4px 0 0;background:var(--green-pale);position:relative;min-height:3px;}
  .bar.has-data{background:var(--green-soft);}
  .bar.full{background:var(--green-deep);}
  .bar-label{font-size:9px;color:#9a9a86;margin-top:5px;}

  .heatmap{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .hm-cell{aspect-ratio:1;border-radius:4px;background:var(--green-pale);position:relative;}
  .hm-cell.l1{background:#DCE7D3;}
  .hm-cell.l2{background:var(--green-soft);}
  .hm-cell.l3{background:var(--green-deep);}
  .hm-cell.today{box-shadow:0 0 0 1.5px var(--mustard);}
  .hm-dow{font-size:9px;color:#9a9a86;text-align:center;margin-bottom:2px;}
  .hm-head{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px;}

  .history-list{display:flex;flex-direction:column;gap:2px;}
  .h-row{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid #F0ECDE;font-size:13px;}
  .h-row:last-child{border-bottom:none;}
  .h-date{width:74px;color:var(--ink);font-weight:700;flex-shrink:0;}
  .h-track{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden;}
  .h-fill{height:100%;background:var(--mustard);}
  .h-pct{width:34px;text-align:right;color:#8a8a76;font-size:12px;flex-shrink:0;}

  .empty{font-size:13px;color:#9a9a86;text-align:center;padding:20px 0;}

  footer{margin-top:26px;text-align:center;font-size:11.5px;color:#9a9a86;font-family:'Fraunces',serif;font-style:italic;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Weekly Lifestyle Sheet</div>
    <h1>Roz Ka Thaal</h1>
    <div class="sub">Aaj ka track karo, ya niche dashboard me apni history dekho.</div>
  </header>

  <div class="nav">
    <button class="nav-btn active" data-view="track">Aaj</button>
    <button class="nav-btn" data-view="dashboard">Dashboard</button>
  </div>

  <div id="trackView">
    <div class="date-bar">
      <button class="date-nav-btn" id="prevDay">‹</button>
      <div class="date-label">
        <div class="d" id="dateLabel"></div>
        <span class="today-pill" id="todayPill"></span>
      </div>
      <button class="date-nav-btn" id="nextDay">›</button>
    </div>

    <div class="progress-row">
      <span id="progLabel">0/9</span>
      <div class="progress-track"><div class="progress-fill" id="progFill" style="width:0%"></div></div>
    </div>

    <div id="sections"></div>
  </div>

  <div id="dashboardView" style="display:none;">
    <div class="stat-grid">
      <div class="stat-card streak">
        <div class="stat-num" id="statStreak">0</div>
        <div class="stat-label">Current Streak</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statBest">0</div>
        <div class="stat-label">Best Streak</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statAvg">0%</div>
        <div class="stat-label">30-Day Avg</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Last 14 Din</div>
      <div class="bars" id="bars"></div>
    </div>

    <div class="panel">
      <div class="panel-title" id="monthTitle">Is Mahine</div>
      <div class="hm-head" id="hmHead"></div>
      <div class="heatmap" id="heatmap"></div>
    </div>

    <div class="panel">
      <div class="panel-title">Recent History</div>
      <div class="history-list" id="historyList"></div>
    </div>
  </div>

  <footer>khaate raho, chalte raho, badhte raho</footer>
</div>

<script>
const CONTENT = [
  { title: 'Subah Uthke', time: '6:00-7:00', num: '01',
    items: ['Warm water + nimbu','4-5 bheege badam + 1 akhrot','20-30 min movement — walk / bodyweight / trek practice'] },
  { title: 'Breakfast', time: 'ghar se nikalne se pehle', num: '02',
    items: ['Poha/upma + peanuts ya sprouts <span class="alt">— ya cheela / paneer bhurji / curd+oats</span>','1 glass doodh ya chaas'] },
  { title: 'Mid-Morning', time: 'office pahunchke', num: '03',
    items: ['Roasted chana ya almonds (mutthi bhar)','Ek cup chai/green tea — sugar kam'] },
  { title: 'Lunch', time: '1:00-1:30 ya jab mile', num: '04',
    items: ['Dal (bada portion) + roti/chawal + sabzi <span class="alt">— chana/rajma/paneer bhurji/moong dal rotate karo</span>','1 katori curd','Chhaas khaane ke baad'] },
  { title: 'Evening', time: '5:30-6:30', num: '05',
    items: ['Makhana/roasted chana ka dabba (bahar ka fried avoid)','1 fruit — seb/kela/amla'] },
  { title: 'Dinner', time: 'jaldi jitna ho sake', num: '06',
    items: ['Khichdi / soya-paneer sabzi + roti <span class="alt">— ya curd rice jab bohot late ho</span>','Sone se 2-3 ghante pehle finish'] },
  { title: 'Raat', time: '10:30-11:00', num: '07',
    items: ['Haldi doodh (hafte me 3-4 din)','Screen band — 30 min pehle','7+ ghante neend'] }
];
const TOTAL_ITEMS = CONTENT.reduce((s,sec)=>s+sec.items.length,0);
const DOW = ['S','M','T','W','T','F','S'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function fmtDate(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function isSameDay(a,b){ return fmtDate(a)===fmtDate(b); }

let currentDate = new Date();
let currentState = {};
let index = []; // array of date strings that have any saved data

// Uses browser localStorage — works when this file is opened directly
// or served from your own laptop. Data stays only on this browser/device.
async function loadIndex(){
  try{
    const raw = localStorage.getItem('thaal:index');
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
async function saveIndex(idx){
  try{ localStorage.setItem('thaal:index', JSON.stringify(idx)); }catch(e){ console.error(e); }
}
async function loadDate(dateStr){
  try{
    const raw = localStorage.getItem('thaal:'+dateStr);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
async function saveDate(dateStr, data){
  try{
    localStorage.setItem('thaal:'+dateStr, JSON.stringify(data));
    if(!index.includes(dateStr)){
      index.push(dateStr);
      index.sort();
      await saveIndex(index);
    }
  }catch(e){ console.error(e); }
}
function countChecked(data){ return Object.values(data).filter(Boolean).length; }
function pctFor(data){ return Math.round(countChecked(data)/TOTAL_ITEMS*100); }

// ---------- TRACK VIEW ----------
async function renderTrack(){
  const dateStr = fmtDate(currentDate);
  currentState = await loadDate(dateStr);

  const today = new Date();
  document.getElementById('dateLabel').textContent =
    currentDate.toLocaleDateString('en-IN',{weekday:'short', day:'numeric', month:'short'});
  document.getElementById('todayPill').textContent = isSameDay(currentDate, today) ? 'AAJ' : '';

  renderProgress();
  renderSections();
}
function renderProgress(){
  const c = countChecked(currentState);
  document.getElementById('progLabel').textContent = c + '/' + TOTAL_ITEMS;
  document.getElementById('progFill').style.width = (c/TOTAL_ITEMS*100) + '%';
}
function renderSections(){
  const el = document.getElementById('sections');
  el.innerHTML = '';
  CONTENT.forEach((sec, si)=>{
    const box = document.createElement('div');
    box.className = 'section';
    let itemsHtml = '';
    sec.items.forEach((txt, ii)=>{
      const id = si + '-' + ii;
      const checked = !!currentState[id];
      itemsHtml += `<div class="item ${checked?'checked':''}" data-id="${id}">
        <div class="box"></div>
        <div class="item-text">${txt}</div>
      </div>`;
    });
    box.innerHTML = `
      <div class="section-head">
        <span class="section-num">${sec.num}</span>
        <span class="section-title">${sec.title}</span>
        <span class="section-time">${sec.time}</span>
      </div>
      ${itemsHtml}`;
    el.appendChild(box);
  });
  el.querySelectorAll('.item').forEach(item=>{
    item.addEventListener('click', async ()=>{
      const id = item.getAttribute('data-id');
      currentState[id] = !currentState[id];
      item.classList.toggle('checked');
      renderProgress();
      await saveDate(fmtDate(currentDate), currentState);
    });
  });
}

document.getElementById('prevDay').onclick = ()=>{
  currentDate.setDate(currentDate.getDate()-1);
  renderTrack();
};
document.getElementById('nextDay').onclick = ()=>{
  const today = new Date();
  const next = new Date(currentDate); next.setDate(next.getDate()+1);
  if(next > today && !isSameDay(next, today)) return;
  currentDate = next;
  renderTrack();
};

// ---------- DASHBOARD VIEW ----------
async function renderDashboard(){
  const today = new Date();
  const todayStr = fmtDate(today);

  // Build a map dateStr -> pct for quick lookup (only for dates we need)
  const dataCache = {};
  async function getPct(dateStr){
    if(dataCache[dateStr] !== undefined) return dataCache[dateStr];
    const d = await loadDate(dateStr);
    const p = pctFor(d);
    dataCache[dateStr] = p;
    return p;
  }

  // Streak calc (day counts if >=50% done)
  let streak = 0;
  {
    let d = new Date(today);
    while(true){
      const ds = fmtDate(d);
      const p = await getPct(ds);
      if(p >= 50){ streak++; d.setDate(d.getDate()-1); }
      else break;
    }
  }
  // Best streak: scan index
  let best = 0, run = 0;
  const sortedIdx = [...index].sort();
  let prevDate = null;
  for(const ds of sortedIdx){
    const p = await getPct(ds);
    if(p >= 50){
      if(prevDate){
        const diffDays = Math.round((new Date(ds) - new Date(prevDate))/86400000);
        run = diffDays === 1 ? run+1 : 1;
      } else run = 1;
      best = Math.max(best, run);
      prevDate = ds;
    } else {
      run = 0; prevDate = null;
    }
  }
  best = Math.max(best, streak);

  // 30-day avg
  let sum=0, count=0;
  for(let i=0;i<30;i++){
    const d = new Date(today); d.setDate(d.getDate()-i);
    const ds = fmtDate(d);
    if(index.includes(ds)){
      sum += await getPct(ds); count++;
    }
  }
  const avg = count ? Math.round(sum/count) : 0;

  document.getElementById('statStreak').textContent = streak;
  document.getElementById('statBest').textContent = best;
  document.getElementById('statAvg').textContent = avg + '%';

  // Last 14 days bar chart
  const barsEl = document.getElementById('bars');
  barsEl.innerHTML = '';
  for(let i=13;i>=0;i--){
    const d = new Date(today); d.setDate(d.getDate()-i);
    const ds = fmtDate(d);
    const has = index.includes(ds);
    const p = has ? await getPct(ds) : 0;
    const col = document.createElement('div');
    col.className = 'bar-col';
    const cls = !has ? '' : (p>=90 ? 'full' : 'has-data');
    col.innerHTML = `<div class="bar ${cls}" style="height:${Math.max(p,4)}%"></div>
      <div class="bar-label">${d.getDate()}</div>`;
    barsEl.appendChild(col);
  }

  // Heatmap for current month
  document.getElementById('monthTitle').textContent = MONTHS[today.getMonth()] + ' ' + today.getFullYear();
  const hmHead = document.getElementById('hmHead');
  hmHead.innerHTML = DOW.map(d=>`<div class="hm-dow">${d}</div>`).join('');

  const hm = document.getElementById('heatmap');
  hm.innerHTML = '';
  const year = today.getFullYear(), month = today.getMonth();
  const firstDay = new Date(year, month, 1);
  const startOffset = firstDay.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();

  for(let i=0;i<startOffset;i++){
    hm.appendChild(document.createElement('div'));
  }
  for(let day=1; day<=daysInMonth; day++){
    const d = new Date(year, month, day);
    const ds = fmtDate(d);
    const cell = document.createElement('div');
    let cls = 'hm-cell';
    if(d <= today){
      const has = index.includes(ds);
      if(has){
        const p = await getPct(ds);
        if(p>=80) cls += ' l3';
        else if(p>=40) cls += ' l2';
        else if(p>0) cls += ' l1';
      }
    }
    if(isSameDay(d, today)) cls += ' today';
    cell.className = cls;
    cell.title = ds;
    hm.appendChild(cell);
  }

  // Recent history list (last 10 entries with data)
  const histEl = document.getElementById('historyList');
  const recent = [...index].sort().reverse().slice(0,10);
  if(recent.length === 0){
    histEl.innerHTML = '<div class="empty">Abhi tak koi entry nahi — Aaj tab me jaake tick karna shuru karo.</div>';
  } else {
    histEl.innerHTML = '';
    for(const ds of recent){
      const p = await getPct(ds);
      const d = new Date(ds);
      const label = d.toLocaleDateString('en-IN',{day:'numeric',month:'short'});
      const row = document.createElement('div');
      row.className = 'h-row';
      row.innerHTML = `<div class="h-date">${label}</div>
        <div class="h-track"><div class="h-fill" style="width:${p}%"></div></div>
        <div class="h-pct">${p}%</div>`;
      histEl.appendChild(row);
    }
  }
}

// ---------- NAV ----------
document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.addEventListener('click', async ()=>{
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const view = btn.getAttribute('data-view');
    document.getElementById('trackView').style.display = view==='track' ? '' : 'none';
    document.getElementById('dashboardView').style.display = view==='dashboard' ? '' : 'none';
    if(view === 'dashboard') await renderDashboard();
  });
});

(async function init(){
  index = await loadIndex();
  await renderTrack();
})();
</script>
</body>
</html>
